<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>发票自动生成系统 v1 · 本地优先</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
  <div class="brand">📦 发票自动生成系统 <span class="ver">v1</span></div>
  <div class="topbar-right">
    <span class="badge badge-local">本地优先 · 无服务器</span>
    <span id="dbStatus" class="badge">存储: 初始化…</span>
  </div>
</header>
<div class="layout">
  <nav class="sidebar">
    <button class="nav-btn active" data-view="overview">架构总览</button>
    <button class="nav-btn" data-view="wizard">生成发票向导</button>
    <button class="nav-btn" data-view="channels">渠道·收货人主数据</button>
    <button class="nav-btn" data-view="skus">SKU 主数据</button>
    <button class="nav-btn" data-view="templates">模板库</button>
    <button class="nav-btn" data-view="monitor">校验·监控</button>
  </nav>
  <main id="main" class="content"></main>
</div>
<!-- ExcelJS 本地离线版：填模板副本、保样式 -->
<script src="exceljs.min.js"></script>
<!-- 已同步的 FBA箱唛交接 索引（倒着填搜索源，免 fetch、file:// 也可用） -->
<script src="handover_index.js"></script>
<!-- 预烘焙的装箱清单内容（按货件号一键拉物品，免 fetch、纯静态可用） -->
<script src="packing_lists.js"></script>
<!-- SKU 主数据（商品申报信息同步：成本价÷汇率→申报价，带版本号）-->
<script src="skus.js"></script>
<!-- 箱型规格主数据（景兴纸业箱型/箱重/尺寸，@SKU纸箱规格表，带版本号）-->
<script src="box_specs.js"></script>
<!-- 全量申报价索引（14114 SKU，去前缀快速查找，后台主数据未覆盖时自动兜底）-->
<script src="sku_declare.js"></script>
<script src="app.js"></script>
</body>
</html>
